# Build configuration for FoliaPerms.
#
# Note: do NOT hardcode org.gradle.java.home here. The Java toolchain / release
# version is configured in build.gradle (Java 17), and Gradle will use JAVA_HOME
# or an auto-detected JDK. A machine-specific path here breaks builds on other
# machines and in CI.
org.gradle.parallel=true
org.gradle.caching=true
